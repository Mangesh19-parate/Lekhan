services:
  db:
    image: postgres:16
    container_name: lekhan_postgres_dev
    environment:
      POSTGRES_USER: lekhan
      POSTGRES_PASSWORD: lekhan
      POSTGRES_DB: lekhan_dev
    ports:
      - "5432:5432"
    volumes:
      - lekhan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lekhan -d lekhan_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lekhan_pg:

