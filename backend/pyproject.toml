[project]
name = "lekhan-backend"
version = "0.1.0"
description = "Multilingual property legal drafting web app backend"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "docxtpl>=0.19.0",
  "python-docx>=1.1.2",
  "defusedxml>=0.7.1",
  "regex>=2024.11.6",
  "argon2-cffi>=23.1.0",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.2",
  "structlog>=24.4.0",
  "python-multipart>=0.0.17",
  "cryptography>=43.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
  "hypothesis>=6.119.0",
  "mypy>=1.13.0",
  "ruff>=0.7.3",
  "import-linter>=2.1",
  "schemathesis>=3.28.0",
  "bandit>=1.7.10",
  "pip-audit>=2.7.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B904", "B017", "E741", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "golden: marks template golden-file tests",
  "property: marks Hypothesis property-based tests",
]

