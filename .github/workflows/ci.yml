name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    name: Backend Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Ruff Lint & Format Check
        run: |
          cd backend
          ruff check .
          ruff format --check .

      - name: Mypy Strict Type Check
        run: |
          cd backend
          mypy --strict app

      - name: Run Tests (Synthetic Data Only)
        run: |
          cd backend
          pytest -q -m "not slow"

  frontend-check:
    name: Frontend Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm install

      - name: ESLint
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm run lint --if-present

      - name: TypeScript Check
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npx tsc --noEmit

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify No Secrets or Real PII in Diff
        run: |
          echo "Scanning for accidental committed secrets or environment files..."
          if git ls-files | grep -E '\.env$|\.env\.local|\.pem$|\.key$|samples-private/'; then
            echo "ERROR: Forbidden sensitive file tracked in git!"
            exit 1
          fi

